name: Auto Audit
description: Audit npm dependencies and apply vulnerability fixes

inputs:
  operation:
    description: Operation to run, either audit or fix
    required: true

  package-json-path:
    description: Path to the root package.json
    required: false
    default: package.json

  node-version:
    description: Node.js version used by Auto Audit
    required: false
    default: "22"

  app-id:
    description: GitHub App ID used to manage issues and pull requests
    required: true

  private-key:
    description: GitHub App private key
    required: true

  bucket:
    description: Vulnerability bucket to fix
    required: false

  audit-summary:
    description: Path to audit-summary.json for the fix operation
    required: false
    default: audit-summary.json

  pr-files:
    description: Package and lock files eligible for a remediation PR
    required: false

  base-ref:
    description: Base branch for remediation pull requests
    required: false

  artifact-name:
    description: Name of the npm audit report artifact
    required: false
    default: npm-audit-report

outputs:
  buckets:
    description: Vulnerability buckets containing available fixes
    value: ${{ steps.parse.outputs.buckets }}

  base:
    description: Base branch used for remediation pull requests
    value: ${{ steps.base.outputs.ref }}

  package-json-files:
    description: Discovered package.json files
    value: ${{ steps.discover.outputs.package-json-files }}

  package-directories:
    description: Discovered package directories
    value: ${{ steps.discover.outputs.package-directories }}

  pr-files:
    description: Package and lock files eligible for a remediation PR
    value: ${{ steps.discover.outputs.pr-files }}

  changed:
    description: Whether dependency files changed
    value: ${{ steps.apply.outputs.changed }}

  branch:
    description: Remediation pull request branch
    value: ${{ steps.apply.outputs.branch }}

  title:
    description: Remediation pull request title
    value: ${{ steps.apply.outputs.title }}

  commit-message:
    description: Remediation commit message
    value: ${{ steps.apply.outputs.commit_message }}

  body-path:
    description: Remediation pull request body path
    value: ${{ steps.apply.outputs.body_path }}

runs:
  using: composite

  steps:
    - name: Validate operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
      run: |
        set -euo pipefail

        case "$OPERATION" in
          audit | fix)
            ;;
          *)
            echo "operation must be either audit or fix" >&2
            exit 1
            ;;
        esac

    - name: Validate fix inputs
      if: ${{ inputs.operation == 'fix' }}
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        PR_FILES: ${{ inputs.pr-files }}
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        set -euo pipefail

        if [[ -z "$BUCKET" ]]; then
          echo "bucket is required for the fix operation" >&2
          exit 1
        fi

        if [[ -z "$PR_FILES" ]]; then
          echo "pr-files is required for the fix operation" >&2
          exit 1
        fi

        if [[ -z "$BASE_REF" ]]; then
          echo "base-ref is required for the fix operation" >&2
          exit 1
        fi

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v2.2.1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: "**/package-lock.json"

    - name: Resolve base branch
      id: base
      if: ${{ inputs.operation == 'audit' }}
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
      run: |
        echo "ref=$BASE_REF" >> "$GITHUB_OUTPUT"

    - name: Discover package files
      id: discover
      if: ${{ inputs.operation == 'audit' }}
      shell: bash
      env:
        REPOSITORY_ROOT: ${{ github.workspace }}
        PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
        DISCOVER_PACKAGES: ${{ github.action_path }}/discover-package-files.mjs
      run: |
        node "$DISCOVER_PACKAGES"

    - name: Log discovered outputs
      if: ${{ inputs.operation == 'audit' }}
      shell: bash
      env:
        PACKAGE_FILES: ${{ steps.discover.outputs.package-json-files }}
        PACKAGE_DIRECTORIES: ${{ steps.discover.outputs.package-directories }}
        PR_FILES: ${{ steps.discover.outputs.pr-files }}
      run: |
        echo "Discovered package.json files:"
        echo "$PACKAGE_FILES"

        echo "Discovered package directories:"
        echo "$PACKAGE_DIRECTORIES"

        echo "Files eligible for remediation PRs:"
        echo "$PR_FILES"

    - name: Run npm audit
      if: ${{ inputs.operation == 'audit' }}
      shell: bash
      env:
        PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
      run: |
        set -euo pipefail

        package_directory="$(dirname "$PACKAGE_JSON_PATH")"

        echo "Running npm install and audit from: $package_directory"

        cd "$package_directory"

        npm ci --ignore-scripts
        npm audit --json > "$RUNNER_TEMP/audit.json" || true
        npm audit || true

    - name: Bucket vulnerabilities
      id: parse
      if: ${{ inputs.operation == 'audit' }}
      shell: bash
      env:
        AUDIT_FILE: ${{ runner.temp }}/audit.json
        AUDIT_SUMMARY_FILE: ${{ runner.temp }}/audit-summary.json
        PARSE_AUDIT: ${{ github.action_path }}/parse-audit.mjs
      run: |
        node "$PARSE_AUDIT"

    - name: Archive audit report
      if: ${{ inputs.operation == 'audit' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        retention-days: 3
        path: |
          ${{ runner.temp }}/audit.json
          ${{ runner.temp }}/audit-summary.json

    - name: Sync unfixable vulnerabilities issue
      if: ${{ inputs.operation == 'audit' }}
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_REPO: ${{ github.repository }}
        AUDIT_SUMMARY: ${{ runner.temp }}/audit-summary.json
        SYNC_UNFIXABLE_ISSUE: ${{ github.action_path }}/sync-unfixable-issue.sh
      run: |
        bash "$SYNC_UNFIXABLE_ISSUE"

    - name: Fetch audit report
      if: ${{ inputs.operation == 'fix' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/audit

    - name: Install dependencies
      if: ${{ inputs.operation == 'fix' }}
      shell: bash
      env:
        PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
      run: |
        set -euo pipefail

        package_directory="$(dirname "$PACKAGE_JSON_PATH")"

        echo "Installing dependencies from: $package_directory"

        cd "$package_directory"
        npm ci --ignore-scripts

    - name: Apply fixes
      id: apply
      if: ${{ inputs.operation == 'fix' }}
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        AUDIT_SUMMARY: ${{ runner.temp }}/audit/audit-summary.json
        PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
        PR_FILES: ${{ inputs.pr-files }}
        APPLY_FIX: ${{ github.action_path }}/apply-fix.sh
      run: |
        bash "$APPLY_FIX" "$BUCKET"

    - name: Raise signed PR
      if: ${{ inputs.operation == 'fix' && steps.apply.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
      with:
        token: ${{ steps.app-token.outputs.token }}
        sign-commits: true
        base: ${{ inputs.base-ref }}
        branch: ${{ steps.apply.outputs.branch }}
        commit-message: ${{ steps.apply.outputs.commit_message }}
        title: ${{ steps.apply.outputs.title }}
        body-path: ${{ steps.apply.outputs.body_path }}
        add-paths: ${{ inputs.pr-files }}
