name: Auto Audit
description: Audit npm dependencies and apply vulnerability fixes

inputs:
  package-json-paths:
    description: |
      Package.json files to evaluate, one per line.
      Workspace package.json files are discovered automatically.
    required: false
    default: |
      package.json

  node-version:
    description: Node.js version used by Auto Audit
    required: false
    default: "22"

  app-id:
    description: GitHub App ID used to manage issues and pull requests
    required: true

  private-key:
    description: GitHub App private key
    required: true

outputs:
  buckets:
    description: Vulnerability buckets containing available fixes
    value: ${{ steps.parse.outputs.buckets }}

  base:
    description: Base branch used for remediation pull requests
    value: ${{ steps.base.outputs.ref }}

  package-json-files:
    description: Discovered package.json files
    value: ${{ steps.discover.outputs.package-json-files }}

  package-directories:
    description: Discovered package directories
    value: ${{ steps.discover.outputs.package-directories }}

  pr-files:
    description: Package and lock files eligible for a remediation PR
    value: ${{ steps.discover.outputs.pr-files }}

runs:
  using: composite

  steps:
    - name: Resolve base branch
      id: base
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
      run: |
        set -euo pipefail
        echo "ref=$BASE_REF" >> "$GITHUB_OUTPUT"

    - name: Pull repository
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.base.outputs.ref }}

    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v2.2.1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: "**/package-lock.json"

    - name: Discover package files
      id: discover
      shell: bash
      env:
        REPOSITORY_ROOT: ${{ github.workspace }}
        PACKAGE_JSON_PATHS: ${{ inputs.package-json-paths }}
        DISCOVER_PACKAGES: ${{ github.action_path }}/discover-package-files.mjs
      run: |
        set -euo pipefail
        node "$DISCOVER_PACKAGES"

    - name: Log discovered outputs
      shell: bash
      env:
        PACKAGE_FILES: ${{ steps.discover.outputs.package-json-files }}
        PACKAGE_DIRECTORIES: ${{ steps.discover.outputs.package-directories }}
        PR_FILES: ${{ steps.discover.outputs.pr-files }}
      run: |
        set -euo pipefail
        echo "Discovered package.json files:"
        echo "$PACKAGE_FILES"

        echo "Discovered package directories:"
        echo "$PACKAGE_DIRECTORIES"

        echo "Files eligible for remediation PRs:"
        echo "$PR_FILES"

    - name: Run npm audit
      shell: bash
      env:
        PACKAGE_JSON_PATHS: ${{ inputs.package-json-paths }}
      run: |
        set -euo pipefail

        package_directory="$(dirname "$PACKAGE_JSON_PATH")"

        echo "Running npm install and audit from: $package_directory"

        cd "$package_directory"

        npm ci --ignore-scripts
        npm audit --json > "$RUNNER_TEMP/audit.json" || true
        npm audit || true

    - name: Bucket vulnerabilities
      id: parse
      shell: bash
      env:
        AUDIT_FILE: ${{ runner.temp }}/audit.json
        AUDIT_SUMMARY_FILE: ${{ runner.temp }}/audit-summary.json
        PARSE_AUDIT: ${{ github.action_path }}/parse-audit.mjs
      run: |
        set -euo pipefail
        node "$PARSE_AUDIT"

    - name: Resolve remediation buckets
      id: remediation
      shell: bash
      env:
        AUDIT_SUMMARY: ${{ runner.temp }}/audit-summary.json
      run: |
        set -euo pipefail
        node <<'JS'
        const fs = require("fs");
        const summary = JSON.parse(
        fs.readFileSync(process.env.AUDIT_SUMMARY, "utf8"),
        );

        const hasEntries = bucket =>
        Array.isArray(summary[bucket]) &&
        summary[bucket].length > 0;

        const output = process.env.GITHUB_OUTPUT;

        fs.appendFileSync(
        output,
        `safe=${hasEntries("safe")}\n`,
        );

        fs.appendFileSync(
        output,
        `force_non_breaking=${hasEntries("forceNonBreaking")}\n`,
        );

        fs.appendFileSync(
        output,
        `breaking=${hasEntries("breaking")}\n`,
        );
        JS

    - name: Archive audit report
      uses: actions/upload-artifact@v4
      with:
        name: npm-audit-report
        retention-days: 3
        path: |
          ${{ runner.temp }}/audit.json
          ${{ runner.temp }}/audit-summary.json

    - name: Sync unfixable vulnerabilities issue
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        GH_REPO: ${{ github.repository }}
        AUDIT_SUMMARY: ${{ runner.temp }}/audit-summary.json
        SYNC_UNFIXABLE_ISSUE: ${{ github.action_path }}/sync-unfixable-issue.sh
      run: |
        set -euo pipefail
        bash "$SYNC_UNFIXABLE_ISSUE"

    - name: Apply safe fixes
      id: apply_safe
      if: ${{ steps.remediation.outputs.safe == 'true' }}
      shell: bash
      env:
        AUDIT_SUMMARY: ${{ runner.temp }}/audit-summary.json
        PACKAGE_JSON_PATHS: ${{ inputs.package-json-paths }}
        PR_FILES: ${{ steps.discover.outputs.pr-files }}
        APPLY_FIX: ${{ github.action_path }}/apply-fix.sh
      run: |
        set -euo pipefail
        bash "$APPLY_FIX" safe

    - name: Raise safe remediation PR
      if: ${{ steps.apply_safe.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
      with:
        token: ${{ steps.app-token.outputs.token }}
        sign-commits: true
        base: ${{ steps.base.outputs.ref }}
        branch: ${{ steps.apply_safe.outputs.branch }}
        commit-message: ${{ steps.apply_safe.outputs.commit_message }}
        title: ${{ steps.apply_safe.outputs.title }}
        body-path: ${{ steps.apply_safe.outputs.body_path }}
        add-paths: ${{ steps.discover.outputs.pr-files }}

    - name: Restore dependency files before non-breaking remediation
      if: ${{ always() && steps.remediation.outputs.force_non_breaking == 'true' }}
      shell: bash
      env:
        PR_FILES: ${{ steps.discover.outputs.pr-files }}
      run: |
        set -euo pipefail

        mapfile -t pr_files <<< "$PR_FILES"

        files=()

        for file in "${pr_files[@]}"; do
          if [[ -n "$file" ]]; then
            files+=("$file")
          fi
        done

        if [[ "${#files[@]}" -gt 0 ]]; then
          git restore --source=HEAD --staged --worktree -- "${files[@]}"
        fi

        echo "Workspace state after restoration:"
        git status --short

    - name: Apply non-breaking out-of-range fixes
      id: apply_force_non_breaking
      if: ${{ steps.remediation.outputs.force_non_breaking == 'true' }}
      shell: bash
      env:
        AUDIT_SUMMARY: ${{ runner.temp }}/audit-summary.json
        PACKAGE_JSON_PATHS: ${{ inputs.package-json-paths }}
        PR_FILES: ${{ steps.discover.outputs.pr-files }}
        APPLY_FIX: ${{ github.action_path }}/apply-fix.sh
      run: |
        set -euo pipefail
        bash "$APPLY_FIX" forceNonBreaking

    - name: Raise non-breaking remediation PR
      if: ${{ steps.apply_force_non_breaking.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
      with:
        token: ${{ steps.app-token.outputs.token }}
        sign-commits: true
        base: ${{ steps.base.outputs.ref }}
        branch: ${{ steps.apply_force_non_breaking.outputs.branch }}
        commit-message: ${{ steps.apply_force_non_breaking.outputs.commit_message }}
        title: ${{ steps.apply_force_non_breaking.outputs.title }}
        body-path: ${{ steps.apply_force_non_breaking.outputs.body_path }}
        add-paths: ${{ steps.discover.outputs.pr-files }}

    - name: Restore dependency files before breaking remediation
      if: ${{ always() && steps.remediation.outputs.breaking == 'true' }}
      shell: bash
      env:
        PR_FILES: ${{ steps.discover.outputs.pr-files }}
      run: |
        set -euo pipefail

        mapfile -t pr_files <<< "$PR_FILES"

        files=()

        for file in "${pr_files[@]}"; do
          if [[ -n "$file" ]]; then
            files+=("$file")
          fi
        done

        if [[ "${#files[@]}" -gt 0 ]]; then
           git restore --source=HEAD --staged --worktree -- "${files[@]}"
        fi

        echo "Workspace state after restoration:"
        git status --short

    - name: Apply breaking fixes
      id: apply_breaking
      if: ${{ steps.remediation.outputs.breaking == 'true' }}
      shell: bash
      env:
        AUDIT_SUMMARY: ${{ runner.temp }}/audit-summary.json
        PACKAGE_JSON_PATHS: ${{ inputs.package-json-paths }}
        PR_FILES: ${{ steps.discover.outputs.pr-files }}
        APPLY_FIX: ${{ github.action_path }}/apply-fix.sh
      run: |
        set -euo pipefail
        bash "$APPLY_FIX" breaking

    - name: Raise breaking remediation PR
      if: ${{ steps.apply_breaking.outputs.changed == 'true' }}
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
      with:
        token: ${{ steps.app-token.outputs.token }}
        sign-commits: true
        base: ${{ steps.base.outputs.ref }}
        branch: ${{ steps.apply_breaking.outputs.branch }}
        commit-message: ${{ steps.apply_breaking.outputs.commit_message }}
        title: ${{ steps.apply_breaking.outputs.title }}
        body-path: ${{ steps.apply_breaking.outputs.body_path }}
        add-paths: ${{ steps.discover.outputs.pr-files }}
