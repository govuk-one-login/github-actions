name: Test Check Vulnerabilities

on: pull_request

permissions:
  contents: read

jobs:
  test-action:
    name: Test action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test auto-audit package discovery
        id: discovery
        env:
          REPOSITORY_ROOT: .github/stubs/workspace-fixture
          PACKAGE_JSON_PATHS: package.json
        run: |
          node auto-audit/discover-package-files.mjs

      - name: Assert discovered package files
        env:
          PACKAGE_FILES: ${{ steps.discovery.outputs.package-json-files }}
        run: |
          set -euo pipefail

          echo "$PACKAGE_FILES" |
            jq -e 'index("package.json") != null'

          echo "$PACKAGE_FILES" |
            jq -e 'index("integration-tests/package.json") != null'

          echo "$PACKAGE_FILES" |
            jq -e 'index("lambdas/foo/package.json") != null'

          echo "$PACKAGE_FILES" |
            jq -e 'index("lambdas/bar/package.json") != null'

      - name: Assert discovered PR files
        env:
          PR_FILES: ${{ steps.discovery.outputs.pr-files }}
        run: |
          set -euo pipefail

          grep -Fx "package.json" <<< "$PR_FILES"
          grep -Fx "integration-tests/package.json" <<< "$PR_FILES"
          grep -Fx "lambdas/foo/package.json" <<< "$PR_FILES"
          grep -Fx "lambdas/bar/package.json" <<< "$PR_FILES"

      - name: Test auto-audit audit parsing
        id: parse
        env:
          AUDIT_FILE: .github/stubs/audit-fixture/audit.json
          AUDIT_SUMMARY_FILE: audit-summary.json
        run: |
          node auto-audit/parse-audit.mjs

      - name: Assert audit summary
        run: |
          set -euo pipefail

          jq -e '.safe | length == 1' audit-summary.json
          jq -e '.safe[0].name == "lodash"' audit-summary.json
          jq -e '.forceNonBreaking | length == 0' audit-summary.json
          jq -e '.breaking | length == 0' audit-summary.json
          jq -e '.unfixable | length == 1' audit-summary.json
          jq -e '.unfixable[0].name == "old-package"' audit-summary.json

      - name: Assert parse outputs
        env:
          SAFE_COUNT: ${{ steps.parse.outputs.safe_count }}
          FORCE_COUNT: ${{ steps.parse.outputs.force_count }}
          BREAKING_COUNT: ${{ steps.parse.outputs.breaking_count }}
          UNFIXABLE_COUNT: ${{ steps.parse.outputs.unfixable_count }}
          BUCKETS: ${{ steps.parse.outputs.buckets }}
        run: |
          set -euo pipefail

          [[ "$SAFE_COUNT" == "1" ]]
          [[ "$FORCE_COUNT" == "0" ]]
          [[ "$BREAKING_COUNT" == "0" ]]
          [[ "$UNFIXABLE_COUNT" == "1" ]]
          [[ "$BUCKETS" == '["safe"]' ]]

      - name: Prepare apply-fix fixture
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/apply-fix-fixture"
          mkdir -p "$RUNNER_TEMP/apply-fix-fixture"

          cat > "$RUNNER_TEMP/apply-fix-fixture/package.json" << 'JSON'
          {
            "name": "apply-fix-fixture",
            "version": "1.0.0",
            "private": true
          }
          JSON

          cat > "$RUNNER_TEMP/apply-fix-fixture/package-lock.json" << 'JSON'
          {
            "name": "apply-fix-fixture",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "apply-fix-fixture",
                "version": "1.0.0"
              }
            }
          }
          JSON

          cat > "$RUNNER_TEMP/apply-fix-fixture/audit-summary.json" << 'JSON'
          {
            "safe": [],
            "forceNonBreaking": [],
            "breaking": [],
            "unfixable": []
          }
          JSON

          cd "$RUNNER_TEMP/apply-fix-fixture"

          git init
          git config user.name "Auto Audit Test"
          git config user.email "auto-audit-test@example.invalid"
          git add package.json package-lock.json audit-summary.json
          git commit -m "Create apply-fix fixture"

      - name: Test apply-fix with dynamic PR files
        id: apply
        working-directory: ${{ runner.temp }}/apply-fix-fixture
        env:
          AUDIT_SUMMARY: audit-summary.json
          PACKAGE_JSON_PATH: package.json
          PR_FILES: |
            package.json
            package-lock.json
        run: |
          bash "$GITHUB_WORKSPACE/auto-audit/apply-fix.sh" breaking

      - name: Assert apply-fix produced no change
        env:
          CHANGED: ${{ steps.apply.outputs.changed }}
        run: |
          set -euo pipefail

          [[ "$CHANGED" == "false" ]]
          git -C "$RUNNER_TEMP/apply-fix-fixture" diff --exit-code

      - name: Prepare multiple package roots fixture
        run: |
          set -euo pipefail

          fixture="$RUNNER_TEMP/multiple-package-roots-fixture"

          rm -rf "$fixture"

          mkdir -p \
            "$fixture/frontend" \
            "$fixture/api" \
            "$fixture/tools"

          cat > "$fixture/frontend/package.json" <<'JSON'
          {
            "name": "frontend",
            "version": "1.0.0",
            "private": true
          }
          JSON

          cat > "$fixture/frontend/package-lock.json" <<'JSON'
          {
            "name": "frontend",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "frontend",
                "version": "1.0.0"
              }
            }
          }
          JSON

          cat > "$fixture/api/package.json" <<'JSON'
          {
            "name": "api",
            "version": "1.0.0",
            "private": true
          }
          JSON

          cat > "$fixture/api/package-lock.json" <<'JSON'
          {
            "name": "api",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "api",
                "version": "1.0.0"
              }
            }
          }
          JSON

          cat > "$fixture/tools/package.json" <<'JSON'
          {
            "name": "tools",
            "version": "1.0.0",
            "private": true
          }
          JSON

          cat > "$fixture/tools/package-lock.json" <<'JSON'
          {
            "name": "tools",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "requires": true,
            "packages": {
              "": {
                "name": "tools",
                "version": "1.0.0"
              }
            }
          }
          JSON

      - name: Test multiple independent package roots
        id: multiple_roots
        env:
          REPOSITORY_ROOT: ${{ runner.temp }}/multiple-package-roots-fixture
          PACKAGE_JSON_PATHS: |
            frontend/package.json
            api/package.json
            tools/package.json
            frontend/package.json
        run: |
          set -euo pipefail

          node auto-audit/discover-package-files.mjs

      - name: Assert multiple package roots discovered
        env:
          PACKAGE_FILES: ${{ steps.multiple_roots.outputs.package-json-files }}
        run: |
          set -euo pipefail

          jq -e '
            length == 3 and
            index("frontend/package.json") != null and
            index("api/package.json") != null and
            index("tools/package.json") != null
          ' <<< "$PACKAGE_FILES"

      - name: Assert multiple package directories discovered
        env:
          PACKAGE_DIRECTORIES: ${{ steps.multiple_roots.outputs.package-directories }}
        run: |
          set -euo pipefail

          jq -e '
            length == 3 and
            index("frontend") != null and
            index("api") != null and
            index("tools") != null
          ' <<< "$PACKAGE_DIRECTORIES"

      - name: Assert multiple root PR files
        env:
          PR_FILES: ${{ steps.multiple_roots.outputs.pr-files }}
        run: |
          set -euo pipefail

          expected_files=(
            "api/package-lock.json"
            "api/package.json"
            "frontend/package-lock.json"
            "frontend/package.json"
            "tools/package-lock.json"
            "tools/package.json"
          )

          for expected_file in "${expected_files[@]}"; do
            grep -Fx "$expected_file" <<< "$PR_FILES"
          done

          actual_count="$(
            sed '/^[[:space:]]*$/d' <<< "$PR_FILES" |
              wc -l |
              tr -d '[:space:]'
          )"

          [[ "$actual_count" == "6" ]]

      - name: Assert duplicate configured roots are removed
        env:
          PACKAGE_FILES: ${{ steps.multiple_roots.outputs.package-json-files }}
        run: |
          set -euo pipefail

          frontend_count="$(
            jq '
              [
                .[]
                | select(. == "frontend/package.json")
              ]
              | length
            ' <<< "$PACKAGE_FILES"
          )"

          [[ "$frontend_count" == "1" ]]

      - name: Assert missing package root is rejected
        env:
          REPOSITORY_ROOT: ${{ runner.temp }}/multiple-package-roots-fixture
          PACKAGE_JSON_PATHS: |
            frontend/package.json
            missing/package.json
        run: |
          set -euo pipefail

          if node auto-audit/discover-package-files.mjs > error.log 2>&1; then
            echo "Expected discovery to reject a missing package.json" >&2
            exit 1
          fi

          grep -F \
            "Configured package.json does not exist: missing/package.json" \
            error.log
