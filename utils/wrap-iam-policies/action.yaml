name: "Wrap IAM Policies"
description: "Generate CloudFormation wrappers for IAM policy template files"
inputs:
  policy-directory:
    description: "Directory containing policy files to wrap"
    required: false
    default: "terraform/policies"
  working-directory:
    description: "Working directory for action"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - name: Check policies directory exists
      id: policy-dir
      shell: bash
      env:
        POLICY_DIR: ${{ inputs.policy-directory }}
      run: echo "exists=$([[ -d "${POLICY_DIR}" ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

    - name: Generate Policy Wrappers
      if: steps.policy-dir.outputs.exists == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        POLICY_DIR: ${{ inputs.policy-directory }}
      run: bash "${{ github.action_path }}/../../scripts/utils/wrap-iam-policies/generate-policy-wrappers.sh" "${POLICY_DIR}"
