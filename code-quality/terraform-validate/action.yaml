name: "Terraform validate"
description: "Run Terraform validation"
inputs:
  terraform_version:
    description: "Terraform version to use"
    required: false
    default: "1.13.3"
    type: string
  terraform_dir:
    description: "Terraform directory to validate"
    required: false
    default: "terraform"
    type: string
  recursive_validate:
    description: "Validate all Terraform subdirectories"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}

    - name: Check Terraform directory exists
      id: tf_dir
      shell: bash
      env:
        TF_DIR: ${{ inputs.terraform_dir }}
      run: echo "exists=$([[ -d "${TF_DIR}" ]] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

    - name: Format
      if: steps.tf_dir.outputs.exists == 'true'
      shell: bash
      working-directory: ${{ inputs.terraform_dir }}
      run: terraform fmt -check -recursive

    - name: Validate
      if: ${{ inputs.recursive_validate == 'false' && steps.tf_dir.outputs.exists == 'true' }}
      shell: bash
      working-directory: ${{ inputs.terraform_dir }}
      run: |
        terraform init -backend=false
        terraform validate

    - name: Recursive Validate
      if: ${{ inputs.recursive_validate == 'true' && steps.tf_dir.outputs.exists == 'true' }}
      run: |
        ${{ github.action_path }}/../../scripts/tf-validate-recursive.sh ${{ inputs.terraform_dir }}
      shell: bash
