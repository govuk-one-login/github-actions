name: "Validate SAM template structure"
description: "Validates a SAM/CloudFormation template conforms to the expected structure using Zod. Does not assert on specific resource configurations."
inputs:
  template:
    description: "Path of the SAM template file to validate"
    required: false
    default: deploy/template.yml
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: lts/*

    - name: Install dependencies
      shell: bash
      run: npm install --no-save zod js-yaml tsx @types/js-yaml

    - name: Validate template structure
      shell: bash
      env:
        TEMPLATE: ${{ inputs.template }}
        STRUCTURAL_ONLY: "true"
        VALIDATE: ${{ github.action_path }}/../../scripts/aws/sam/validate-template-schema.ts
      run: npx tsx "$VALIDATE"
